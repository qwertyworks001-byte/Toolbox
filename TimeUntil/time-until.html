<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Until Calculator</title>
<link rel="icon" type="image/png" href="../Assets/Favicon/Favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../style.css">
<script src="../timer-engine.js"></script>

</head>
<body class="text-slate-200 font-sans antialiased">

<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <header class="mb-8">
    <div class="flex items-center justify-between mb-3">
      <a href="../index.html" class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-blue-400 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Toolbox
      </a>
      <button type="button" id="favToggle" class="text-lg text-slate-600 hover:scale-110 transition-transform" aria-label="Add to favorites" aria-pressed="false">&#9734;</button>
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Time Until Calculator</h1>
    <p class="text-slate-400 mt-1 text-sm sm:text-base">Find out exactly how long remains until a target time.</p>
  </header>

  <div class="glass rounded-2xl p-6">
    <div class="mb-5">
      <div class="flex items-center justify-between mb-2">
        <label for="currentTime" class="text-sm font-medium text-slate-300">Current time</label>
        <button type="button" id="useNowBtn" class="text-xs text-blue-400 hover:text-blue-300">Use now</button>
      </div>
      <input type="time" id="currentTime" step="1"
        class="w-full bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="mb-3">
      <label for="targetTime" class="block text-sm font-medium text-slate-300 mb-2">Target time</label>
      <input type="time" id="targetTime"
        class="w-full bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <label class="inline-flex items-center gap-2 cursor-pointer text-sm mb-2">
      <input type="checkbox" id="useCustomDate" class="rounded bg-slate-900 border-slate-600 text-blue-500 focus:ring-blue-500">
      Target is on a specific date (not today/tomorrow)
    </label>
    <div id="customDateWrap" class="hidden mb-5">
      <input type="date" id="targetDate"
        class="w-full bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-2.5 text-white text-base focus:outline-none focus:ring-2 focus:ring-blue-500 mt-2">
    </div>

    <div class="text-center border-t border-slate-700/60 pt-6" id="resultBlock">
      <p class="text-3xl sm:text-4xl font-bold text-white" id="diffOut">2h 45m</p>
      <p class="text-xs text-slate-500 mt-2" id="assumptionNote"></p>
    </div>
  </div>

</div>

<script>
(function () {
  const currentTime = document.getElementById('currentTime');
  const targetTime = document.getElementById('targetTime');
  const useCustomDate = document.getElementById('useCustomDate');
  const customDateWrap = document.getElementById('customDateWrap');
  const targetDate = document.getElementById('targetDate');
  const useNowBtn = document.getElementById('useNowBtn');
  const diffOut = document.getElementById('diffOut');
  const assumptionNote = document.getElementById('assumptionNote');

  function pad(n) { return n.toString().padStart(2, '0'); }

  function setNow() {
    const now = new Date();
    currentTime.value = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  function parseTimeToday(baseDate, timeStr) {
    const parts = timeStr.split(':').map(Number);
    const d = new Date(baseDate);
    d.setHours(parts[0] || 0, parts[1] || 0, parts[2] || 0, 0);
    return d;
  }

  function formatDiff(ms) {
    const totalMinutes = Math.round(ms / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    const parts = [];
    if (days > 0) parts.push(`${days}d`);
    if (hours > 0 || days > 0) parts.push(`${hours}h`);
    parts.push(`${minutes}m`);
    return parts.join(' ');
  }

  function update() {
    if (!currentTime.value || !targetTime.value) {
      diffOut.textContent = 'Enter both times';
      assumptionNote.textContent = '';
      return;
    }

    const now = new Date();
    const nowMoment = parseTimeToday(now, currentTime.value);

    let targetMoment;
    let note = '';

    if (useCustomDate.checked && targetDate.value) {
      const [y, m, d] = targetDate.value.split('-').map(Number);
      const base = new Date(y, m - 1, d);
      targetMoment = parseTimeToday(base, targetTime.value);
      if (targetMoment.getTime() < nowMoment.getTime()) {
        note = 'That date/time is in the past.';
      }
    } else {
      targetMoment = parseTimeToday(now, targetTime.value);
      if (targetMoment.getTime() <= nowMoment.getTime()) {
        targetMoment.setDate(targetMoment.getDate() + 1);
        note = "That time has already passed today, so this assumes tomorrow at that time.";
      }
    }

    const diffMs = targetMoment.getTime() - nowMoment.getTime();
    diffOut.textContent = formatDiff(Math.abs(diffMs));
    assumptionNote.textContent = note;
  }

  useNowBtn.addEventListener('click', () => { setNow(); update(); });
  useCustomDate.addEventListener('change', () => {
    customDateWrap.classList.toggle('hidden', !useCustomDate.checked);
    if (useCustomDate.checked && !targetDate.value) {
      const d = new Date();
      targetDate.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    update();
  });
  [currentTime, targetTime, targetDate].forEach(el => el.addEventListener('input', update));

  setNow();
  const t = new Date(Date.now() + 2 * 60 * 60 * 1000);
  targetTime.value = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
  update();
})();
</script>
<script>
(function () {
  const TOOL_ID = 'time-until';
  const FAV_KEY = 'toolbox:favorites';
  const btn = document.getElementById('favToggle');
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; } }
  function render() {
    const isFav = getFavs().includes(TOOL_ID);
    btn.innerHTML = isFav ? '&#9733;' : '&#9734;';
    btn.classList.toggle('text-amber-400', isFav);
    btn.classList.toggle('text-slate-600', !isFav);
    btn.setAttribute('aria-pressed', isFav);
    btn.setAttribute('aria-label', isFav ? 'Remove from favorites' : 'Add to favorites');
  }
  btn.addEventListener('click', () => {
    const favs = getFavs();
    const idx = favs.indexOf(TOOL_ID);
    if (idx === -1) favs.push(TOOL_ID); else favs.splice(idx, 1);
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
    render();
  });
  render();
})();
</script>
</body>
</html>
