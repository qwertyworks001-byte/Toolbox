<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox</title>
<link rel="icon" type="image/png" href="Assets/Favicon/Favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tools-data.js"></script>
<script src="firebase-config.js"></script>
<script src="toolbox-sync.js"></script>
<script src="toolbox-fab.js"></script>
<link rel="stylesheet" href="style.css">
<script src="timer-engine.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff5f2e;
    --accent-soft: rgba(255, 95, 46, 0.14);
    --accent-2: #ffcf4d;
  }
  body { font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; }
  .font-display { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }

  .search-wrap {
    border-bottom: 2px solid rgba(255, 255, 255, 0.12);
    transition: border-color 0.15s ease;
  }
  .search-wrap:focus-within {
    border-color: var(--accent);
  }
  #searchInput:focus { outline: none; }

  .random-btn {
    background: var(--accent-2);
    color: #241a05;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 0 0 #c99f2e;
  }
  .random-btn:hover {
    transform: translateY(-1px) rotate(-1deg);
    box-shadow: 0 3px 0 0 #c99f2e;
  }
  .random-btn:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 0 #c99f2e;
  }

  .cat-tag {
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .cat-tag.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0d06;
  }
  .cat-tag:not(.active):hover {
    border-color: rgba(255, 95, 46, 0.5);
  }

  .tool-panel {
    background: #14171c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .tool-panel:hover {
    transform: translateY(-2px);
  }
  .tool-panel:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .drag-handle { touch-action: none; cursor: grab; color: #64748b; font-size: 1.3rem; line-height: 1; min-width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.5rem; }
  .drag-handle:hover, .drag-handle:focus-visible { color: var(--accent-2); background: rgba(255,255,255,0.06); }
  .reorderable { cursor: grab; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .drag-origin { opacity: 0.3; outline: 2px dashed var(--accent); outline-offset: -2px; }
  .drag-ghost { position: fixed !important; margin: 0 !important; pointer-events: none; z-index: 1000; transform: scale(1.045) rotate(1.2deg); box-shadow: 0 20px 45px rgba(0,0,0,0.6); border-color: var(--accent); opacity: 0.97; transition: none; }
  .drag-ghost.dropping { transform: none; box-shadow: none; transition: left 0.18s ease, top 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
  .fav-btn { transition: transform 0.15s ease, color 0.15s ease; }
  .fav-btn:hover { transform: scale(1.15); }
</style>
</head>
<body class="text-slate-200 antialiased">

<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">

  <!-- Hero -->
  <header class="mb-10">
    <div class="flex items-baseline gap-3 flex-wrap">
      <h1 class="font-display text-4xl sm:text-5xl font-bold text-white tracking-tight">Toolbox</h1>
      <span class="text-sm text-slate-500" id="toolStat"></span>
    </div>
    <p class="text-slate-400 mt-2 text-base sm:text-lg max-w-xl">A workbench of small, fast tools &mdash; for the things you need to figure out but don't want to open ten tabs for.</p>
  </header>

  <!-- Search -->
  <div class="search-wrap mb-6 pb-3">
    <div class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-slate-500 shrink-0">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" id="searchInput" placeholder="What do you need to figure out?"
        class="w-full bg-transparent text-lg sm:text-xl text-white placeholder:text-slate-500 py-1">
    </div>
  </div>

  <!-- Category tags + random tool -->
  <div class="flex flex-wrap items-center gap-2 mb-10">
    <div class="flex flex-wrap gap-2" id="chipRow"></div>
    <button type="button" id="randomToolBtn" class="random-btn text-sm font-semibold px-4 py-1.5 rounded-md inline-flex items-center gap-1.5 ml-auto">
      &#127922; Random tool
    </button>
  </div>

  <!-- Favorites -->
  <section class="mb-10 hidden" id="favoritesSection">
    <h2 class="font-display text-lg font-semibold text-white mb-3">&#11088; Favorites <span class="text-xs font-normal text-slate-500 ml-1">drag a card to reorder (on touch, press and hold)</span></h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="favoritesGrid"></div>
  </section>

  <!-- Popular Tools -->
  <section class="mb-10" id="popularSection">
    <h2 class="font-display text-lg font-semibold text-white mb-3">Popular</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="popularGrid"></div>
  </section>

  <!-- Recently Used -->
  <section class="mb-10 hidden" id="recentSection">
    <h2 class="font-display text-lg font-semibold text-white mb-3">Recently used</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="recentGrid"></div>
  </section>

  <!-- Main grid (filtered by search / category / favorites) -->
  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-display text-lg font-semibold text-white" id="mainGridLabel">All tools</h2>
      <span class="text-xs text-slate-500" id="mainGridCount"></span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="mainGrid"></div>
    <p class="text-sm text-slate-500 text-center py-8 hidden" id="emptyState" role="status">No tools match that search yet.</p>
  </section>

</div>

<script>
(function () {
  const TOOLS = window.TOOLBOX_TOOLS || [];
  const CATEGORIES = window.TOOLBOX_CATEGORIES || [];
  const FAV_KEY = 'toolbox:favorites';
  const RECENT_KEY = 'toolbox:recent';

  const toolStat = document.getElementById('toolStat');
  const searchInput = document.getElementById('searchInput');
  const chipRow = document.getElementById('chipRow');
  const mainGrid = document.getElementById('mainGrid');
  const mainGridLabel = document.getElementById('mainGridLabel');
  const mainGridCount = document.getElementById('mainGridCount');
  const emptyState = document.getElementById('emptyState');
  const popularSection = document.getElementById('popularSection');
  const popularGrid = document.getElementById('popularGrid');
  const favoritesSection = document.getElementById('favoritesSection');
  const favoritesGrid = document.getElementById('favoritesGrid');
  const recentSection = document.getElementById('recentSection');
  const recentGrid = document.getElementById('recentGrid');
  const randomToolBtn = document.getElementById('randomToolBtn');

  let activeFilter = 'all'; // 'all' | 'favorites' | category key
  let query = '';

  toolStat.textContent = `${TOOLS.length} tools across ${CATEGORIES.length} categories`;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function getFavorites() {
    try { const v = JSON.parse(localStorage.getItem(FAV_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function setFavorites(list) {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function isFavorite(id) { return getFavorites().includes(id); }
  function toggleFavorite(id) {
    const favs = getFavorites();
    const idx = favs.indexOf(id);
    if (idx === -1) favs.push(id); else favs.splice(idx, 1);
    setFavorites(favs);
  }

  function getRecent() {
    try { const v = JSON.parse(localStorage.getItem(RECENT_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function pushRecent(id) {
    let recent = getRecent().filter(x => x !== id);
    recent.unshift(id);
    recent = recent.slice(0, 6);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch (e) {}
  }

  function toolById(id) { return TOOLS.find(t => t.id === id); }

  // ── Tag search ──────────────────────────────────────────────
  // Every word you type must match something in the tool. A word scores highest on an exact tag, then the start of
  // a tag (or of a word inside one), then anywhere inside a tag; the name counts too; the description is a weak last
  // resort. Tools are listed best match first.
  const norm = (s) => String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  const tagsOf = (tool) => (tool.tags || tool.keywords || []).map(norm);
  const wordStart = (text, w) => (' ' + text).includes(' ' + w);

  function wordScore(tool, w) {
    let best = 0;
    const name = norm(tool.name);
    if (name === w) best = 12; else if (wordStart(name, w)) best = 9; else if (name.includes(w)) best = 6;
    tagsOf(tool).forEach(tag => {
      const s = tag === w ? 10 : wordStart(tag, w) ? 7 : tag.includes(w) ? 4 : 0;
      if (s > best) best = s;
    });
    if (!best && norm(tool.description).includes(w)) best = 1;
    return best;
  }
  function matchScore(tool, q) {
    const words = norm(q).split(/\s+/).filter(Boolean);
    if (!words.length) return 1;
    let total = 0;
    for (const w of words) { const s = wordScore(tool, w); if (!s) return 0; total += s; }
    return total;
  }
  function matchedTags(tool, q) {          // the tags that explain why this tool showed up
    const words = norm(q).split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    const raw = tool.tags || tool.keywords || [];
    return raw.filter(t => words.some(w => norm(t).includes(w))).slice(0, 4);
  }

  function cardHTML(tool, reorder) {
    const fav = isFavorite(tool.id);
    const tags = query ? matchedTags(tool, query) : [];
    const tagRow = tags.length
      ? `<div class="flex flex-wrap gap-1.5 mt-1">${tags.map(t => `<span class="text-[11px] leading-none px-2 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">#${esc(t)}</span>`).join('')}</div>`
      : '';
    return `
      <a href="${tool.path}" data-tool-id="${tool.id}" class="tool-panel rounded-xl p-5 flex flex-col gap-2 border-l-[3px] relative" style="border-left-color:${tool.color}">
        <button type="button" class="fav-btn absolute top-3 right-3 text-lg ${fav ? 'text-amber-400' : 'text-slate-600'}" data-fav-toggle="${tool.id}" aria-label="${fav ? 'Remove from favorites' : 'Add to favorites'}" aria-pressed="${fav}">
          ${fav ? '★' : '☆'}
        </button>
        ${reorder ? `<button type="button" class="drag-handle absolute top-2 right-9" data-drag-handle="${tool.id}" aria-label="Reorder ${esc(tool.name)}: drag it, or use the arrow keys" title="Drag to reorder (or use the arrow keys)">&#10303;</button>` : ''}
        <h3 class="font-display text-base font-semibold text-white ${reorder ? 'pr-20' : 'pr-6'}">${tool.name}</h3>
        <p class="text-sm text-slate-400 leading-relaxed">${tool.description}</p>
        ${tagRow}
      </a>
    `;
  }

  function attachCardHandlers(container) {
    container.querySelectorAll('[data-fav-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(btn.getAttribute('data-fav-toggle'));
        render();
      });
    });
    container.querySelectorAll('a[data-tool-id]').forEach(a => {
      a.addEventListener('click', () => pushRecent(a.getAttribute('data-tool-id')));
    });
  }

  // ── Reordering favorites ──
  // Mouse: drag a card from anywhere. Touch: press and hold a card for a moment (so scrolling still works), or grab its
  // handle to start right away. Keyboard: focus a handle and use the arrow keys (Home / End jump to the ends).
  let reordering = false, pendingRender = false;
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function saveOrder(container) {
    const ids = [...container.querySelectorAll(':scope > a[data-tool-id]')].map(a => a.getAttribute('data-tool-id'));
    setFavorites(ids.concat(getFavorites().filter(id => !ids.includes(id))));
  }
  function announce(msg) {
    let live = document.getElementById('orderLive');
    if (!live) { live = document.createElement('div'); live.id = 'orderLive'; live.className = 'sr-only'; live.setAttribute('aria-live', 'polite'); document.body.appendChild(live); }
    live.textContent = msg;
  }
  function enableReorder(container) {
    const cardsOf = () => [...container.querySelectorAll(':scope > a[data-tool-id]')];

    // Move one card and slide every other card smoothly into its new place.
    function flip(card, change) {
      const before = new Map(cardsOf().map(c => [c, c.getBoundingClientRect()]));
      change();
      if (reduceMotion) return;
      cardsOf().forEach(c => {
        if (c === card) return;
        const a = c.getBoundingClientRect(), b = before.get(c), dx = b.left - a.left, dy = b.top - a.top;
        if (!dx && !dy) return;
        c.style.transition = 'none'; c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        void c.offsetWidth;
        c.style.transition = 'transform 0.18s ease'; c.style.transform = '';
        c.__anim = true; clearTimeout(c.__t); c.__t = setTimeout(() => { c.style.transition = ''; c.__anim = false; }, 200);
      });
    }

    function startDrag(card, p0) {
      reordering = true; card.__pressing = true;
      const r = card.getBoundingClientRect(), off = { x: p0.clientX - r.left, y: p0.clientY - r.top };
      const ghost = card.cloneNode(true);
      ghost.removeAttribute('href'); ghost.removeAttribute('data-tool-id'); ghost.classList.add('drag-ghost');
      ghost.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;';
      document.body.appendChild(ghost);
      card.classList.add('drag-origin'); document.body.classList.add('is-dragging');
      try { const sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges(); } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
      let pt = { x: p0.clientX, y: p0.clientY }, raf = 0, done = false;
      const onMove = (ev) => { pt = { x: ev.clientX, y: ev.clientY }; };
      const block = (ev) => { ev.preventDefault(); };
      const tick = () => {
        if (done) return;
        ghost.style.left = (pt.x - off.x) + 'px'; ghost.style.top = (pt.y - off.y) + 'px';
        const edge = 90;
        if (pt.y < edge) window.scrollBy(0, -Math.ceil((edge - pt.y) / 5));
        else if (pt.y > window.innerHeight - edge) window.scrollBy(0, Math.ceil((pt.y - (window.innerHeight - edge)) / 5));
        const kids = cardsOf();
        const target = kids.find(c => {
          if (c === card || c.__anim) return false;
          const b = c.getBoundingClientRect();
          return pt.x >= b.left && pt.x <= b.right && pt.y >= b.top && pt.y <= b.bottom;
        });
        if (target) flip(card, () => container.insertBefore(card, kids.indexOf(target) < kids.indexOf(card) ? target : target.nextSibling));
        raf = requestAnimationFrame(tick);
      };
      const end = () => {
        if (done) return; done = true; cancelAnimationFrame(raf);
        window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
        document.removeEventListener('touchmove', block);
        const stop = (ev) => { ev.preventDefault(); ev.stopPropagation(); };      // dropping must not open the tool
        window.addEventListener('click', stop, true); setTimeout(() => window.removeEventListener('click', stop, true), 80);
        const b = card.getBoundingClientRect();
        ghost.classList.add('dropping'); ghost.style.left = b.left + 'px'; ghost.style.top = b.top + 'px';
        setTimeout(() => {
          ghost.remove(); card.classList.remove('drag-origin'); document.body.classList.remove('is-dragging');
          const ids = cardsOf().map(c => c.getAttribute('data-tool-id')), tool = toolById(card.getAttribute('data-tool-id'));
          saveOrder(container); reordering = false; pendingRender = false; render();
          if (tool) announce(tool.name + ' moved to position ' + (ids.indexOf(tool.id) + 1) + ' of ' + ids.length);
          setTimeout(() => { card.__pressing = false; }, 400);
        }, reduceMotion ? 0 : 200);
      };
      window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
      document.addEventListener('touchmove', block, { passive: false });
      raf = requestAnimationFrame(tick);
    }

    cardsOf().forEach(card => {
      const handle = card.querySelector('[data-drag-handle]'), id = card.getAttribute('data-tool-id');
      card.classList.add('reorderable');
      card.addEventListener('dragstart', (e) => e.preventDefault());                       // no native link-dragging
      card.addEventListener('contextmenu', (e) => { if (card.__pressing) e.preventDefault(); });   // long-press menu on phones
      if (handle) handle.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });

      card.addEventListener('pointerdown', (e) => {
        if (reordering || e.button > 0 || e.target.closest('[data-fav-toggle]')) return;
        const touch = e.pointerType === 'touch', sx = e.clientX, sy = e.clientY;
        let lx = sx, ly = sy, timer = 0;
        const cleanup = () => { clearTimeout(timer); card.__pressing = false; window.removeEventListener('pointermove', check); window.removeEventListener('pointerup', cleanup); window.removeEventListener('pointercancel', cleanup); };
        const begin = (p) => { cleanup(); startDrag(card, p); };
        function check(ev) {
          lx = ev.clientX; ly = ev.clientY;
          const d = Math.hypot(lx - sx, ly - sy);
          if (touch) { if (d > 9) cleanup(); }          // finger moved first: they're scrolling, not dragging
          else if (d > 5) begin(ev);                    // mouse moved a little: it's a drag, not a click
        }
        if (e.target.closest('[data-drag-handle]')) { e.preventDefault(); begin(e); return; }   // handle: start at once
        card.__pressing = true;
        window.addEventListener('pointermove', check); window.addEventListener('pointerup', cleanup); window.addEventListener('pointercancel', cleanup);
        if (touch) timer = setTimeout(() => begin({ clientX: lx, clientY: ly }), 230);
      });

      if (handle) handle.addEventListener('keydown', (e) => {
        const kids = cardsOf(), i = kids.indexOf(card), k = e.key; let j = i;
        if (k === 'ArrowLeft' || k === 'ArrowUp') j = i - 1; else if (k === 'ArrowRight' || k === 'ArrowDown') j = i + 1;
        else if (k === 'Home') j = 0; else if (k === 'End') j = kids.length - 1; else return;
        e.preventDefault();
        if (j < 0 || j >= kids.length || j === i) return;
        container.insertBefore(card, j > i ? kids[j].nextSibling : kids[j]);
        saveOrder(container); render();
        const again = document.querySelector('[data-drag-handle="' + id + '"]'); if (again) again.focus();
        const tool = toolById(id); if (tool) announce(tool.name + ' moved to position ' + (j + 1) + ' of ' + kids.length);
      });
    });
  }

  // With a search typed, the chip numbers show how many tools match in each category, so you can see where results are.
  function countFor(key) {
    const pool = key === 'all' ? TOOLS
      : key === 'favorites' ? TOOLS.filter(t => isFavorite(t.id))
      : TOOLS.filter(t => (t.categories || []).includes(key));
    return query ? pool.filter(t => matchScore(t, query) > 0).length : pool.length;
  }

  function renderChips() {
    const chips = [
      { key: 'all', label: 'All', emoji: '' },
      { key: 'favorites', label: 'Favorites', emoji: '\u2b50' },
      ...CATEGORIES.map(c => ({ key: c.key, label: c.label, emoji: c.emoji }))
    ];
    chipRow.innerHTML = chips.map(c => {
      const n = countFor(c.key);
      const dim = query && n === 0 && activeFilter !== c.key ? ' opacity-50' : '';
      return `
      <button type="button" class="cat-tag text-xs font-medium px-3 py-1.5 rounded-md border border-slate-700 bg-slate-900/50 text-slate-300 ${activeFilter === c.key ? 'active' : ''}${dim}" data-chip="${c.key}">
        ${c.emoji ? c.emoji + ' ' : ''}${c.label} <span class="opacity-60">${n}</span>
      </button>`;
    }).join('');
    chipRow.querySelectorAll('[data-chip]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.getAttribute('data-chip');
        render();
      });
    });
  }

  function inFilter(tool) {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'favorites') return isFavorite(tool.id);
    return (tool.categories || []).includes(activeFilter);
  }

  function filteredTools() {
    const favOrder = getFavorites(), fi = (id) => { const i = favOrder.indexOf(id); return i < 0 ? 9999 : i; };
    const scored = TOOLS.map((tool, i) => ({ tool, i, score: query ? matchScore(tool, query) : 1 }))
      .filter(x => x.score > 0 && inFilter(x.tool));
    // Best match first; favorites win ties (and lead the list when nothing is typed).
    scored.sort((a, b) => (b.score - a.score) || ((isFavorite(b.tool.id) ? 1 : 0) - (isFavorite(a.tool.id) ? 1 : 0)) || (fi(a.tool.id) - fi(b.tool.id)) || (a.i - b.i));
    return scored.map(x => x.tool);
  }

  function filterLabel() {
    if (activeFilter === 'favorites') return 'Favorites';
    const c = CATEGORIES.find(x => x.key === activeFilter);
    return c ? c.label : 'this category';
  }

  function renderEmpty(results) {
    emptyState.classList.toggle('hidden', results.length > 0);
    if (results.length) return;
    const q = esc(query);
    if (query && activeFilter !== 'all') {
      const elsewhere = TOOLS.filter(t => matchScore(t, query) > 0).length;
      if (elsewhere) {
        emptyState.innerHTML = `No tools match &ldquo;${q}&rdquo; in ${esc(filterLabel())}. Try searching again in <a href="#all" id="emptyAllLink" class="text-amber-300 underline underline-offset-2 hover:text-amber-200">All</a>? <span class="text-slate-600">(${elsewhere} ${elsewhere === 1 ? 'match' : 'matches'} there)</span>`;
        document.getElementById('emptyAllLink').addEventListener('click', (e) => { e.preventDefault(); activeFilter = 'all'; render(); });
        return;
      }
    }
    if (!query && activeFilter === 'favorites') { emptyState.textContent = 'No favorites yet. Tap the \u2606 on any tool to add it here.'; return; }
    emptyState.textContent = 'No tools match that search yet.';
  }

  function render() {
    if (reordering) { pendingRender = true; return; }
    renderChips();

    const results = filteredTools();
    const reorderMain = activeFilter === 'favorites' && !query;
    mainGrid.innerHTML = results.map(t => cardHTML(t, reorderMain)).join('');
    attachCardHandlers(mainGrid);
    if (reorderMain) enableReorder(mainGrid);
    renderEmpty(results);

    const catMeta = CATEGORIES.find(c => c.key === activeFilter);
    if (activeFilter === 'all') mainGridLabel.textContent = query ? 'Results' : 'All tools';
    else if (activeFilter === 'favorites') mainGridLabel.textContent = 'Favorites';
    else mainGridLabel.textContent = catMeta ? `${catMeta.emoji} ${catMeta.label}` : 'Tools';
    mainGridCount.textContent = `${results.length} tool${results.length === 1 ? '' : 's'}`;

    // Favorites + Popular + Recent only show on the default, unfiltered view
    const showExtras = activeFilter === 'all' && !query;

    const favoriteTools = getFavorites().map(toolById).filter(Boolean);
    favoritesSection.classList.toggle('hidden', !showExtras || favoriteTools.length === 0);
    if (showExtras && favoriteTools.length) {
      favoritesGrid.innerHTML = favoriteTools.map(t => cardHTML(t, true)).join('');
      attachCardHandlers(favoritesGrid);
      enableReorder(favoritesGrid);
    }

    popularSection.classList.toggle('hidden', !showExtras);
    if (showExtras) {
      popularGrid.innerHTML = TOOLS.filter(t => t.popular).map(t => cardHTML(t)).join('');
      attachCardHandlers(popularGrid);
    }

    const recentIds = getRecent().map(toolById).filter(Boolean);
    recentSection.classList.toggle('hidden', !showExtras || recentIds.length === 0);
    if (showExtras && recentIds.length) {
      recentGrid.innerHTML = recentIds.map(t => cardHTML(t)).join('');
      attachCardHandlers(recentGrid);
    }
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim();
    render();
  });

  randomToolBtn.addEventListener('click', () => {
    if (!TOOLS.length) return;
    const pick = TOOLS[Math.floor(Math.random() * TOOLS.length)];
    pushRecent(pick.id);
    window.location.href = pick.path;
  });

  window.addEventListener('toolbox:synced', render);   // favourites / recents arrived from another device
  render();
})();
</script>
</body>
</html>
