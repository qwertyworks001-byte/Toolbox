<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../Assets/Favicon/Favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tool — Toolbox</title>
    <!-- Core layout stylesheet link -->
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../toolbox-sync.js"></script>
<script src="../timer-engine.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #f97316;
        }
        h1 {
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #94a3b8;
            margin: 0 0 2rem 0;
            font-size: 1.1rem;
        }
        .link-counter {
            font-size: 0.9rem;
            color: #f97316;
            background: rgba(249, 115, 22, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(249, 115, 22, 0.2);
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        
        /* Glass layout properties built on your central rules */
        .glass-card {
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 2rem;
        }
        .table-scroll {
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }
        .table-scroll:last-child {
            margin-bottom: 0;
        }
        .links-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .links-table th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .links-table td {
            padding: 1rem;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }
        .links-table tr:last-child td {
            border-bottom: none;
        }
        .link-name {
            font-weight: 500;
            color: #ffffff;
        }
        .link-url {
            color: #38bdf8;
            text-decoration: none;
        }
        .link-url:hover {
            text-decoration: underline;
        }
        .link-desc {
            color: #94a3b8;
        }
        .open-btn {
            display: inline-flex;
            align-items: center;
            color: #f97316;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.2s, color 0.2s;
        }
        .open-btn:hover {
            color: #fb923c;
            transform: translateX(2px);
        }

        /* Category Subsections headers styling */
        .category-header-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1.5rem 1rem 0.75rem 1rem;
        }
        .container > .category-header-container:first-of-type {
            padding-top: 0.5rem;
        }
        .category-title {
            color: #f97316;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }
        .category-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(249, 115, 22, 0.25) 0%, rgba(249, 115, 22, 0) 100%);
        }

        /* ── My links: filter, add form, sync note ── */
        .filter-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1.25rem; }
        .filter-row .link-counter { margin: 0 0 0 auto; }
        .tab-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 0.4rem 0.9rem; border-radius: 9999px; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
        .add-card { border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
        .add-card h2 { margin: 0 0 0.9rem 0; font-size: 1.05rem; color: #fff; }
        .add-grid { display: grid; grid-template-columns: 1fr 1.4fr 1.4fr auto; gap: 0.75rem; align-items: end; }
        @media (max-width: 800px) { .add-grid { grid-template-columns: 1fr; } }
        .add-grid label { display: block; font-size: 0.8rem; color: #94a3b8; }
        .add-grid input { width: 100%; box-sizing: border-box; margin-top: 0.3rem; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0f131a; color: #f1f5f9; font-size: 0.95rem; font-family: inherit; }
        .add-grid input:focus { outline: none; border-color: #f97316; }
        .add-btn { padding: 0.58rem 1.2rem; border-radius: 8px; border: 0; background: #f97316; color: #1a0d06; font-weight: 700; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
        .add-btn:hover { background: #fb923c; }
        .add-msg { font-size: 0.85rem; min-height: 1.1rem; margin: 0.6rem 0 0 0; }
        .add-msg.err { color: #fb7185; } .add-msg.ok { color: #34d399; }
        .sync-note { font-size: 0.8rem; color: #94a3b8; margin: 0.2rem 0 0 0; }
        .sync-note.ok { color: #34d399; } .sync-note.warn { color: #fbbf24; }
        .sync-note a { color: #fbbf24; }
        .del-btn { background: none; border: 0; color: #64748b; cursor: pointer; font-size: 0.85rem; margin-right: 1rem; font-family: inherit; }
        .del-btn:hover, .del-btn.armed { color: #fb7185; }
        .empty-note { color: #94a3b8; text-align: center; padding: 1.5rem 1rem; margin: 0; }

        /* ── header row: back link left, sync badge + favourite star right ── */
        .top-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 2rem; }
        .top-row .back-link { margin-bottom: 0; }
        .top-actions { display: flex; align-items: center; gap: 0.5rem; }
        #toolbox-sync-badge { position: static !important; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-row">
            <a href="../index.html" class="back-link">← Toolbox</a>
            <div class="top-actions"><span id="syncSlot"></span><button type="button" id="favToggle" style="background:none;border:0;font-size:1.3rem;cursor:pointer;color:#475569" aria-label="Add to favorites" aria-pressed="false">&#9734;</button></div>
        </div>
        
        <h1>Link Tool</h1>
        <p class="subtitle">A simple place for useful links, references, and websites.</p>
        
        <div class="glass add-card">
            <h2>Add your own link</h2>
            <div class="add-grid">
                <label>Link name<input id="lName" maxlength="80" placeholder="e.g. My portfolio"></label>
                <label>Link<input id="lUrl" maxlength="2000" placeholder="https://example.com"></label>
                <label>Description (optional)<input id="lDesc" maxlength="200" placeholder="What is it?"></label>
                <button type="button" id="addBtn" class="add-btn">Add link</button>
            </div>
            <p id="addMsg" class="add-msg" role="status"></p>
            <p id="syncNote" class="sync-note"></p>
        </div>

        <div class="filter-row">
            <button type="button" class="tab-btn active" data-filter="all">All</button>
            <button type="button" class="tab-btn" data-filter="preset">Preset</button>
            <button type="button" class="tab-btn" data-filter="mine">My links</button>
            <div id="counter-badge" class="link-counter">0 links</div>
        </div>

        <!-- Master Glass Box container -->
        <div class="glass-card glass" id="linkSections">
            <!-- Category sections are generated from the LINKS array below. -->
        </div>
    </div>

    <script>
        // ==========================================================
        // LINKS DATA
        // Add a new link by adding another object below. It will
        // automatically appear under its category's section (a new
        // category name automatically creates a new section).
        // ==========================================================
        const LINKS = [

            // ==========================================================
            // ROBLOX
            // ==========================================================
            {
                category: 'Roblox',
                name: 'Roblox',
                url: 'https://www.roblox.com',
                description: 'Roblox website'
            },
            {
                category: 'Roblox',
                name: 'Roblox Creator Hub',
                url: 'https://create.roblox.com',
                description: 'Roblox development and Creator Hub'
            },
            {
                category: 'Roblox',
                name: 'CCUCheck',
                url: 'https://ccucheck.com/',
                description: 'Search games, track player history, and follow Roblox trends.'
            },
            {
                category: 'Roblox',
                name: 'CREATOR EXCHANGE',
                url: 'https://creatorexchange.io/',
                description: 'Creator Exchange is a third-party business platform for Roblox developers that provides game analytics, an experience marketplace, and standardized legal templates for safe transactions.'
            },
            {
                category: 'Roblox',
                name: 'Rotrends',
                url: 'https://www.rotrends.com/',
                description: 'See what is trending on Roblox.'
            },

            // ==========================================================
            // UI & DESIGN
            // ==========================================================
            {
                category: 'UI & Design',
                name: 'ui resources',
                url: 'https://ui-resources.com/',
                description: 'Free directory providing curated user interface assets, tools, and tutorials for designers.'
            },
            {
                category: 'UI & Design',
                name: 'ui8net',
                url: 'https://ui8.net/',
                description: 'The Public 3D Asset Library.'
            },
            {
                category: 'UI & Design',
                name: 'Figma',
                url: 'https://www.figma.com/',
                description: 'Collaborative interface design and prototyping tool.'
            },
            {
                category: 'UI & Design',
                name: 'GFXRhino — PFP Background Pack',
                url: 'https://gfxrhino.com/products/pfp-background-pack/',
                description: 'Free pack of 20 high-quality Roblox GFX profile picture backgrounds (1920x1920, .psd).'
            },
            {
                category: 'UI & Design',
                name: 'GFXRhino — Rhino Effects Pack',
                url: 'https://gfxrhino.com/products/rhino-effects-pack/',
                description: 'Free pack of 250+ Roblox GFX effects, lighting, overlays, and textures in one .psd file.'
            },
            {
                category: 'UI & Design',
                name: 'GFXRhino — Anime Effects Pack',
                url: 'https://gfxrhino.com/products/anime-effects-pack/',
                description: 'Free pack of 480+ anime-style Photoshop effects (fire, water, aura, nebula, and more) for Roblox GFX.'
            },

            // ==========================================================
            // AUDIO
            // ==========================================================
            {
                category: 'Audio',
                name: 'zapsplat',
                url: 'https://www.zapsplat.com/',
                description: 'Free sound effects and music'
            },
            {
                category: 'Audio',
                name: 'Freesound',
                url: 'https://freesound.org/',
                description: 'Free sound effects and music'
            },

            // ==========================================================
            // 3D ASSETS & MODELS
            // ==========================================================
            {
                category: '3D Assets & Models',
                name: 'mixamo',
                url: 'https://www.mixamo.com/#/',
                description: 'Empowering creativity with animated 3D characters.'
            },
            {
                category: '3D Assets & Models',
                name: 'polyhaven',
                url: 'https://polyhaven.com/',
                description: 'The Public 3D Asset Library.'
            },
            {
                category: '3D Assets & Models',
                name: 'blendswap',
                url: 'https://blendswap.com/',
                description: 'Free Blender models, materials, and scenes shared under Creative Commons'
            },
            {
                category: '3D Assets & Models',
                name: 'sketchfab',
                url: 'https://sketchfab.com/tags/glb',
                description: 'Glb 3D models ready to view and download for free.'
            },

            // ==========================================================
            // 3D TOOLS
            // ==========================================================
            {
                category: '3D Tools',
                name: 'low poly',
                url: 'https://low-poly.com/tools/reduce',
                description: 'Reduce polygons of any 3D model.'
            },
            {
                category: '3D Tools',
                name: 'qptr.io',
                url: 'https://qptr.io/',
                description: 'Reduce polygons of any 3D model.'
            },

            // ==========================================================
            // GENERAL
            // ==========================================================
            {
                category: 'General',
                name: 'YouTube',
                url: 'https://www.youtube.com',
                description: 'YouTube'
            },
            {
                category: 'General',
                name: 'Grammarly Humanizer',
                url: 'https://www.grammarly.com/ai-humanizer',
                description: 'Improve your writing with Grammarly Humanizer'
            },
            {
                category: 'General',
                name: 'ZeroGPT AI Detector',
                url: 'https://www.zerogpt.com/?r=gwords&gad_source=1&gad_campaignid=20588310201&gbraid=0AAAAADAB6m-Q8RPT0zAyxGMDqgf9uhfDs&gclid=CjwKCAjwwrPVBhA1EiwAv_YO-Uhf7DhVKyrlSKn0RPAlXwNWCE0FkKoZQTtismc1B2C1_OucCMoJ_hoCovQQAvD_BwE',
                description: 'Detect AI-generated text with ZeroGPT'
            }
        ];

        // Fixed category order; anything not listed here is appended after, in
        // the order it first appears in LINKS.
        const CATEGORY_ORDER = ['Roblox', 'UI & Design', 'Audio', '3D Assets & Models', '3D Tools', 'General'];

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Only http/https links are ever rendered or opened.
        function isSafeUrl(url) {
            try {
                const parsed = new URL(url);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        function displayUrl(url) {
            return url.replace(/^https?:\/\//, '');
        }

        function buildCategoryOrder(links) {
            const seen = [];
            links.forEach(link => {
                if (!seen.includes(link.category)) seen.push(link.category);
            });
            const predefined = CATEGORY_ORDER.filter(c => seen.includes(c));
            const extra = seen.filter(c => !CATEGORY_ORDER.includes(c));
            return [...predefined, ...extra];
        }

        // ==========================================================
        // RENDERING + "MY LINKS" (private, synced to the signed-in account)
        // ==========================================================
        const MY_KEY = 'toolbox:mylinks', OWNER_KEY = 'toolbox:mylinks-owner', DAY = 86400000;
        const $ = (id) => document.getElementById(id);
        let filter = 'all', delArm = null, mine = loadMine();
        let db = null, user = null, unsub = null, pushT = null, busy = false;

        // Each saved link: { id, name, url, description, c: created, t: last changed, del?: true }.
        // Deleted links stay briefly as "tombstones" so a delete on one device isn't undone by another.
        function validEntry(x) { return x && typeof x.id === 'string' && typeof x.name === 'string' && typeof x.url === 'string'; }
        function cleanList(list) {
            return (Array.isArray(list) ? list : []).filter(validEntry).map(x => ({
                id: x.id, name: x.name.slice(0, 80), url: x.url.slice(0, 2000), description: String(x.description || '').slice(0, 200),
                c: Number(x.c) || 0, t: Number(x.t) || 0, del: x.del ? true : undefined
            })).filter(x => !x.del || Date.now() - x.t < 60 * DAY);
        }
        function loadMine() { try { return cleanList(JSON.parse(localStorage.getItem(MY_KEY))); } catch (e) { return []; } }
        function saveMine() { try { localStorage.setItem(MY_KEY, JSON.stringify(mine)); } catch (e) {} }
        function mergeLists(a, b) {
            const m = new Map();
            a.concat(b).forEach(x => { const y = m.get(x.id); if (!y || x.t > y.t) m.set(x.id, x); });
            return cleanList([...m.values()]);
        }
        const fingerprint = (list) => JSON.stringify(list.slice().sort((p, q) => (p.id < q.id ? -1 : 1)));

        function setSync(state) {
            const n = $('syncNote');
            if (state === 'signedout') { n.innerHTML = 'Saved on this device only. <a href="#" id="syncSignIn">Sign in</a> to keep them on all your devices.'; n.className = 'sync-note warn'; const a = $('syncSignIn'); if (a) a.onclick = (e) => { e.preventDefault(); if (window.ToolboxAuth) window.ToolboxAuth.open(); else location.href = '../HabitTracker/habit-tracker.html#sync'; }; }
            else if (state === 'syncing') { n.textContent = '\u2601 Syncing\u2026'; n.className = 'sync-note'; }
            else if (state === 'synced') { n.textContent = '\u2601 Synced. Only you can see your links.'; n.className = 'sync-note ok'; }
            else { n.textContent = '\u2601 Sync problem. Your links are safe on this device and will sync when it works again.'; n.className = 'sync-note warn'; }
        }

        function listen() {
            setSync('syncing');
            unsub = db.doc('users/' + user.uid + '/toolbox/links').onSnapshot((snap) => {
                let remote = [];
                if (snap.exists) { try { remote = cleanList(JSON.parse(snap.data().json)); } catch (e) {} }
                mine = mergeLists(mine, remote); saveMine(); renderLinks();
                if (fingerprint(mine) !== fingerprint(remote)) push(); else setSync('synced');
            }, () => setSync('error'));
        }
        async function push() {
            if (!user || busy) return; busy = true; setSync('syncing');
            const ref = db.doc('users/' + user.uid + '/toolbox/links');
            try {
                const merged = await db.runTransaction(async (tx) => {
                    const s = await tx.get(ref); let remote = [];
                    if (s.exists) { try { remote = cleanList(JSON.parse(s.data().json)); } catch (e) {} }
                    const m = mergeLists(mine, remote);
                    tx.set(ref, { json: JSON.stringify(m), updated: firebase.firestore.FieldValue.serverTimestamp() });
                    return m;
                });
                mine = merged; saveMine(); renderLinks(); setSync('synced');
            } catch (e) { setSync('error'); }
            busy = false;
        }
        function schedulePush() { if (!user) return; clearTimeout(pushT); pushT = setTimeout(push, 400); }

        function initCloud() {
            try {
                if (!window.firebase || !window.TOOLBOX_FIREBASE) { setSync('signedout'); return; }
                if (!firebase.apps.length) firebase.initializeApp(window.TOOLBOX_FIREBASE); if (window.toolboxActivateAppCheck) window.toolboxActivateAppCheck();
                db = firebase.firestore();
                firebase.auth().onAuthStateChanged((u) => {
                    if (unsub) { unsub(); unsub = null; }
                    user = u;
                    if (!u) { setSync('signedout'); return; }
                    // A different account on a shared device must not inherit the previous person's links.
                    const owner = localStorage.getItem(OWNER_KEY);
                    if (owner && owner !== u.uid) { mine = []; saveMine(); renderLinks(); }
                    try { localStorage.setItem(OWNER_KEY, u.uid); } catch (e) {}
                    listen();
                });
            } catch (e) { setSync('error'); }
        }

        // ── adding / deleting ──
        function addLink() {
            const name = $('lName').value.trim(); let url = $('lUrl').value.trim(); const description = $('lDesc').value.trim();
            const msg = $('addMsg'); msg.className = 'add-msg err';
            if (!name || !url) { msg.textContent = 'Please enter a link name and a link.'; return; }
            if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;
            if (!isSafeUrl(url)) { msg.textContent = 'That doesn\u2019t look like a valid web link.'; return; }
            const now = Date.now();
            mine.push({ id: now.toString(36) + Math.random().toString(36).slice(2, 7), name: name.slice(0, 80), url: url.slice(0, 2000), description: description.slice(0, 200), c: now, t: now });
            saveMine(); schedulePush();
            ['lName', 'lUrl', 'lDesc'].forEach(i => $(i).value = '');
            msg.className = 'add-msg ok'; msg.textContent = 'Added to My links.';
            if (filter === 'preset') filter = 'all';
            renderLinks();
        }
        function deleteLink(id) {
            if (delArm !== id) { delArm = id; renderLinks(); setTimeout(() => { if (delArm === id) { delArm = null; renderLinks(); } }, 3000); return; }
            delArm = null; const now = Date.now();
            mine = mine.map(x => x.id === id ? { id: x.id, name: x.name, url: x.url, description: '', c: x.c, t: now, del: true } : x);
            saveMine(); schedulePush(); renderLinks();
        }

        // ── drawing ──
        function sectionHTML(title, rowsHTML) {
            return `
                <div class="category-header-container">
                    <span class="category-title">${escapeHtml(title)}</span>
                    <div class="category-line"></div>
                </div>
                <div class="table-scroll">
                    <table class="links-table"><tbody>${rowsHTML}</tbody></table>
                </div>`;
        }
        function rowHTML(link, isMine) {
            const u = escapeHtml(link.url);
            const extra = isMine ? `<button type="button" class="del-btn ${delArm === link.id ? 'armed' : ''}" data-del="${escapeHtml(link.id)}">${delArm === link.id ? 'Click again to delete' : 'Delete'}</button>` : '';
            return `
                <tr>
                    <td><span class="link-name">${escapeHtml(link.name)}</span></td>
                    <td><a href="${u}" target="_blank" rel="noopener noreferrer" class="link-url">${escapeHtml(displayUrl(link.url))}</a></td>
                    <td><span class="link-desc">${escapeHtml(link.description || '')}</span></td>
                    <td style="text-align: right; white-space: nowrap;">${extra}<a href="${u}" target="_blank" rel="noopener noreferrer" class="open-btn">Open</a></td>
                </tr>`;
        }

        function renderLinks() {
            const preset = LINKS.filter(link => isSafeUrl(link.url));
            const myList = mine.filter(x => !x.del && isSafeUrl(x.url)).sort((a, b) => b.c - a.c);
            let html = '', shown = 0;

            if (filter !== 'preset') {
                if (myList.length) { html += sectionHTML('My links', myList.map(l => rowHTML(l, true)).join('')); shown += myList.length; }
                else if (filter === 'mine') html += '<p class="empty-note">You haven\u2019t added any links yet. Use the form above to add your first one.</p>';
            }
            if (filter !== 'mine') {
                buildCategoryOrder(preset).forEach(category => {
                    const rows = preset.filter(link => link.category === category);
                    if (rows.length) { html += sectionHTML(category, rows.map(l => rowHTML(l, false)).join('')); shown += rows.length; }
                });
            }
            $('linkSections').innerHTML = html;
            $('counter-badge').textContent = `${shown} ${shown === 1 ? 'link' : 'links'}`;
            document.querySelectorAll('[data-filter]').forEach(b => {
                const k = b.dataset.filter, n = k === 'all' ? preset.length + myList.length : k === 'preset' ? preset.length : myList.length;
                b.textContent = `${{ all: 'All', preset: 'Preset', mine: 'My links' }[k]} (${n})`;
                b.classList.toggle('active', k === filter);
            });
        }

        $('linkSections').addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) deleteLink(b.dataset.del); });
        document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; renderLinks(); }));
        $('addBtn').addEventListener('click', addLink);
        ['lName', 'lUrl', 'lDesc'].forEach(i => $(i).addEventListener('keydown', (e) => { if (e.key === 'Enter') addLink(); }));

        // Favourite star (same behaviour as the other tools)
        (function () {
            const TOOL_ID = 'link-tool', KEY = 'toolbox:favorites', btn = $('favToggle');
            const get = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
            function draw() {
                const f = get().includes(TOOL_ID);
                btn.innerHTML = f ? '&#9733;' : '&#9734;'; btn.style.color = f ? '#fbbf24' : '#475569';
                btn.setAttribute('aria-pressed', f); btn.setAttribute('aria-label', f ? 'Remove from favorites' : 'Add to favorites');
            }
            btn.addEventListener('click', () => {
                const favs = get(), i = favs.indexOf(TOOL_ID);
                if (i === -1) favs.push(TOOL_ID); else favs.splice(i, 1);
                try { localStorage.setItem(KEY, JSON.stringify(favs)); } catch (e) {}
                draw();
            });
            window.addEventListener('toolbox:synced', draw);   // favourites arriving from another device
            draw();
        })();

        // Move the "Sign in to sync" badge into the header row (it is created by toolbox-sync.js after the page loads)
        (function () {
            function dock() {
                const b = $('toolbox-sync-badge'), slot = $('syncSlot');
                if (!b || !slot) return false;
                if (b.parentNode !== slot) slot.appendChild(b);
                return true;
            }
            if (!dock()) new MutationObserver((m, o) => { if (dock()) o.disconnect(); }).observe(document.body, { childList: true });
        })();

        renderLinks();
        initCloud();
    </script>
</body>
</html>
